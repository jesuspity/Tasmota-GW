; Projekte+ Gateway (ESP32 + EFR32 Zigbee)
; Base enxuta do Zigbee Bridge Pro + user_config_override.h, particao padrao 2880k (igual ao gateway)
[platformio]
default_envs            = tasmota32-projekte-gw

[env:tasmota32-projekte-gw]
extends                 = env:tasmota32_base
build_flags             = ${env:tasmota32_base.build_flags}
                          -DFIRMWARE_ZBBRDGPRO
